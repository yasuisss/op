name: Rockchip OpenWrt

on:
  workflow_dispatch:
  schedule:
    - cron: 0 15 * * *

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  CONFIG_FILE: configs/rockchip.config
  EXTRA_CONFIG: configs/extra.config
  DIY_SCRIPT: diy-script.sh
  CLASH_KERNEL: arm64
  CACHE_TOOLCHAIN: true
  UPLOAD_BIN_DIR: false
  FIRMWARE_RELEASE: true
  FIRMWARE_TAG: Rockchip
  TZ: Asia/Shanghai

jobs:
  Build:
    runs-on: ubuntu-22.04

    steps:
    - name: Check Server Performance
      run: |
        echo "警告⚠"
        echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
        echo -e "已知CPU型号(降序): 7763，8370C，8272CL，8171M，E5-2673\n"
        echo "--------------------------CPU信息--------------------------"
        echo "CPU物理数量: $(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
        echo "CPU核心数量: $(nproc)"
        echo -e "CPU型号信息:$(cat /proc/cpuinfo | grep -m1 name | awk -F: '{print $2}')\n"
        echo "--------------------------内存信息--------------------------"
        echo "已安装内存详细信息:"
        echo -e "$(sudo lshw -short -C memory | grep GiB)\n"
        echo "--------------------------硬盘信息--------------------------"
        echo "硬盘数量: $(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT

    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
          # docker rmi $(docker images -q)
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /etc/apt/sources.list.d /usr/local/lib/android 2>/dev/null
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo -E apt-get -y update
          sudo -E apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo -E apt-get -y install $(curl -fsSL https://ophub.org/ubuntu2404-make-openwrt-depends)
          sudo -E systemctl daemon-reload
          #sudo -E apt-get -y full-upgrade
          sudo -E apt-get -y autoremove --purge
          sudo -E apt-get clean
          sudo sed -i '/NVM_DIR/d;/skel/d' /root/{.bashrc,.profile}
          sudo rm -rf ~/{.cargo,.dotnet,.rustup}
          sudo timedatectl set-timezone "${TZ}"
          sudo -E apt install scdoc
          sudo -E apt-get install -y dwarves npm clang llvm lld libbpf-dev
          sudo -E npm install -g pnpm

    - name: Combine Disks
      uses: easimon/maximize-build-space@master
      with:
        swap-size-mb: 1024
        temp-reserve-mb: 100
        root-reserve-mb: 1024

    - name: Checkout
      uses: actions/checkout@main

    - name: Clone Source Code
      run: |
        df -hT $GITHUB_WORKSPACE
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt
        echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV
        COMMIT_AUTHOR=$(git show -s --date=short --format="作者: %an")
        echo "COMMIT_AUTHOR=$COMMIT_AUTHOR" >> $GITHUB_ENV
        COMMIT_DATE=$(git show -s --date=short --format="时间: %ci")
        echo "COMMIT_DATE=$COMMIT_DATE" >> $GITHUB_ENV
        COMMIT_MESSAGE=$(git show -s --date=short --format="内容: %s")
        echo "COMMIT_MESSAGE=$COMMIT_MESSAGE" >> $GITHUB_ENV
        COMMIT_HASH=$(git show -s --date=short --format="hash: %H")
        echo "COMMIT_HASH=$COMMIT_HASH" >> $GITHUB_ENV

    - name: Set Kernel Version to 7.3
      run: |
        cd $OPENWRT_PATH
        # 修改 rockchip target 的默认内核版本为 7.3
        sed -i 's/^KERNEL_PATCHVER:=.*/KERNEL_PATCHVER:=7.3/' target/linux/rockchip/Makefile
        sed -i 's/^KERNEL_TESTING_PATCHVER:=.*/KERNEL_TESTING_PATCHVER:=7.3/' target/linux/rockchip/Makefile
        echo "Current KERNEL_PATCHVER in target/linux/rockchip/Makefile:"
        grep -E '^KERNEL_.*PATCHVER:=' target/linux/rockchip/Makefile

    - name: Generate Variables
      run: |
        # 复制 config 并合并 extra.config（如果有）
        cp $CONFIG_FILE $OPENWRT_PATH/.config
        [ -e "$EXTRA_CONFIG" ] && cat $EXTRA_CONFIG >> $OPENWRT_PATH/.config
        
        # 清理 6.12 旧内核标记并注入 7.3
        sed -i 's/CONFIG_LINUX_6_12=y/CONFIG_LINUX_7_3=y/' $OPENWRT_PATH/.config
        sed -i 's/CONFIG_LINUX_6_18=y/CONFIG_LINUX_7_3=y/' $OPENWRT_PATH/.config
        
        cd $OPENWRT_PATH
        make defconfig > /dev/null 2>&1
        SOURCE_REPO="$(echo $REPO_URL | awk -F '/' '{print $(NF)}')"
        echo "SOURCE_REPO=$SOURCE_REPO" >> $GITHUB_ENV
        DEVICE_TARGET=$(cat .config | grep CONFIG_TARGET_BOARD | awk -F '"' '{print $2}')
        echo "DEVICE_TARGET=$DEVICE_TARGET" >> $GITHUB_ENV
        DEVICE_SUBTARGET=$(cat .config | grep CONFIG_TARGET_SUBTARGET | awk -F '"' '{print $2}')
        echo "DEVICE_SUBTARGET=$DEVICE_SUBTARGET" >> $GITHUB_ENV

    - name: Cache Toolchain
      if: env.CACHE_TOOLCHAIN == 'true'
      uses: HiGarfield/cachewrtbuild@main
      with:
        ccache: false
        # 在缓存键中加入 7.3 标记，避免命中之前 6.18 内核生成的旧工具链缓存导致兼容报错
        mixkey: ${{ env.SOURCE_REPO }}-${{ env.REPO_BRANCH }}-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-k7.3
        prefix: ${{ env.OPENWRT_PATH }}

    - name: Install Feeds
      run: |
        cd $OPENWRT_PATH
        ./scripts/feeds clean
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Patch daed feeds (Remove hardcoded vmlinux-btf dependency)
      run: |
        find feeds/ -type f -name "Makefile" | xargs sed -i 's/+vmlinux-btf//g' 2>/dev/null || true
        find package/ -type f -name "Makefile" | xargs sed -i 's/+vmlinux-btf//g' 2>/dev/null || true

    - name: Load Custom Configuration
      run: |
        [ -e files ] && mv files $OPENWRT_PATH/files
        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE $OPENWRT_PATH/.config
        [ -e $EXTRA_CONFIG ] && cat $EXTRA_CONFIG >> $OPENWRT_PATH/.config
        sed -i 's/CONFIG_LINUX_6_12=y/CONFIG_LINUX_7_3=y/' $OPENWRT_PATH/.config
        sed -i 's/CONFIG_LINUX_6_18=y/CONFIG_LINUX_7_3=y/' $OPENWRT_PATH/.config

        cd $OPENWRT_PATH

        # 1. 彻底恢复受损的构建脚本
        git checkout include/package-ipkg.mk package/kernel/linux/modules/netdevices.mk 2>/dev/null || true

        # 2. 修复 7.3 内核下的 ksmbd 依赖
        sed -i '/smb_compress\.ko/d' package/kernel/linux/modules/fs.mk 2>/dev/null || true
        sed -i 's/smb_compress //g' package/kernel/linux/modules/fs.mk 2>/dev/null || true

        # 3. 规范移除 netdevices.mk 中的 of_mdio 与 phy_package 模块声明
        python3 -c "
        import re
        path = 'package/kernel/linux/modules/netdevices.mk'
        with open(path, 'r') as f:
            content = f.read()

        # 重写 mdio-devres，移除 of_mdio.ko
        target_block = '''define KernelPackage/mdio-devres
          SUBMENU:=\$(NETWORK_DEVICES_MENU)
          TITLE:=MDIO devres support
          KCONFIG:=CONFIG_MDIO_DEVRES
          FILES:=\$(LINUX_DIR)/drivers/net/mdio/mdio-devres.ko
          AUTOLOAD:=\$(call AutoLoad,40,mdio-devres)
        endef'''
        content = re.sub(r'define KernelPackage/mdio-devres.*?endef', target_block, content, flags=re.DOTALL)

        # 移除 phy-realtek 中的 phy_package.ko 声明
        content = re.sub(r'\\\s*\$\(LINUX_DIR\)/drivers/net/phy/phy_package\.ko', '', content)
        content = re.sub(r'\$\(LINUX_DIR\)/drivers/net/phy/phy_package\.ko\s*\\\\?', '', content)

        with open(path, 'w') as f:
            f.write(content)
        "

        # 4. 安全放宽缺失库检测（将 false; 替换为 true;）
        sed -i '/missing dependencies for the following libraries/,/false;/ s/false;/true;/' include/package-ipkg.mk

        # 5. 执行外部脚本与配置
        chmod +x $GITHUB_WORKSPACE/scripts/*.sh
        chmod +x $GITHUB_WORKSPACE/$DIY_SCRIPT
        $GITHUB_WORKSPACE/$DIY_SCRIPT
        $GITHUB_WORKSPACE/scripts/preset-clash-core.sh $CLASH_KERNEL
        $GITHUB_WORKSPACE/scripts/preset-terminal-tools.sh
        $GITHUB_WORKSPACE/scripts/preset-adguard-core.sh $CLASH_KERNEL

    - name: Download DL Package & Verify Kernel
      run: |
        cd $OPENWRT_PATH
        make defconfig
        
        # 校验 7.3 内核是否成功应用
        echo "=== Kernel Configuration Result ==="
        grep -E "CONFIG_LINUX_|CONFIG_TESTING_KERNEL" .config || true
        if ! grep -q "CONFIG_LINUX_7_3=y" .config; then
          echo "::error::Kernel 7.3 was not applied! Check if source tree supports 7.3."
          exit 1
        fi

        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    # ... 下方 Compile Firmware 保持不变 ...
    - name: Compile Firmware
      id: compile
      run: |
        cd $OPENWRT_PATH
        mkdir -p files/etc/uci-defaults
        cp $GITHUB_WORKSPACE/scripts/init-settings.sh files/etc/uci-defaults/99-init-settings
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        echo "DATE=$(date +"%Y-%m-%d %H:%M:%S")" >> $GITHUB_ENV
        echo "FILE_DATE=$(date +"%Y.%m.%d")" >> $GITHUB_ENV

    - name: Check Space Usage
      if: (!cancelled())
      run: df -hT

    - name: Upload Bin Directory
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      uses: actions/upload-artifact@main
      with:
        name: ${{ env.SOURCE_REPO }}-bin-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-${{ env.FILE_DATE }}
        path: ${{ env.OPENWRT_PATH }}/bin

    - name: Organize Files
      if: steps.compile.outputs.status == 'success'
      run: |
        cd $OPENWRT_PATH/bin/targets/*/*
        cat sha256sums
        cp $OPENWRT_PATH/.config build.config
        mv -f $OPENWRT_PATH/bin/packages/*/*/*.ipk packages
        tar -zcf Packages.tar.gz packages
        rm -rf packages feeds.buildinfo version.buildinfo
        echo "KERNEL=$(cat *.manifest | grep ^kernel | cut -d- -f2 | tr -d ' ')" >> $GITHUB_ENV
        echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV

    - name: Upload Firmware To Artifact
      if: steps.compile.outputs.status == 'success' && env.FIRMWARE_RELEASE != 'true'
      uses: actions/upload-artifact@main
      with:
        name: ${{ env.SOURCE_REPO }}-firmware-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE_PATH }}

    - name: Upload Firmware To Release
      if: steps.compile.outputs.status == 'success' && env.FIRMWARE_RELEASE == 'true'
      uses: ncipollo/release-action@v1
      with:
        name: R${{ env.DATE }} for ${{ env.FIRMWARE_TAG }}
        allowUpdates: true
        tag: ${{ env.FIRMWARE_TAG }}
        token: ${{ secrets.GITHUB_TOKEN }}
        artifacts: ${{ env.FIRMWARE_PATH }}/*
        body: |
          **This is OpenWrt Firmware for ${{ env.FIRMWARE_TAG }}**
          ### 📒 固件信息
          - 💻 平台架构: ${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }} (rk35xx)
          - ⚽ 固件源码: ${{ env.REPO_URL }}
          - 💝 源码分支: ${{ env.REPO_BRANCH }}
          - 🚀 内核版本: ${{ env.KERNEL }}
          - 🌐 默认地址: 192.168.100.1
          - 🔑 默认密码: password
          ### 🧊 固件版本
          - 固件编译前最后一次➦[主源码](${{ env.REPO_URL }})更新记录
          - ${{ env.COMMIT_AUTHOR }}
          - ${{ env.COMMIT_DATE }}
          - ${{ env.COMMIT_MESSAGE }}
          - ${{ env.COMMIT_HASH }}
