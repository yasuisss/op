user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 网络传输优化
    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout 65;
    server_tokens  off; # 隐藏 Nginx 版本号，提升安全性

    log_format main '[$time_local] $remote_addr - $remote_user "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$proxy_protocol_addr"';
    
    access_log /var/log/nginx/access.log main;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # HTTP 80 重定向
    server {
        listen 80;
        listen [::]:80;
        server_name example.com; # 填域名
        return 301 https://$host$request_uri;
    }

    # 默认未匹配域名直接断开 TLS 握手，防探测
    server {
        listen 127.0.0.1:8001 ssl default_server;
        ssl_reject_handshake on;
    }

    # 主站点（经 Xray PROXY Protocol 回落接入）
    server {
        listen                     127.0.0.1:8001 ssl proxy_protocol;
        http2                      on;
        server_name                example.com; # 填域名

        set_real_ip_from           127.0.0.1;
        real_ip_header             proxy_protocol;

        ssl_certificate            /etc/ssl/private/fullchain.cer;
        ssl_certificate_key        /etc/ssl/private/private.key;
        ssl_session_timeout        1h;
        ssl_session_cache          shared:SSL:10m;
        ssl_protocols              TLSv1.2 TLSv1.3;
        ssl_ciphers                ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers  off; 

        # OCSP Stapling
        ssl_stapling               on;
        ssl_stapling_verify        on;
        resolver                   1.1.1.1 8.8.8.8 valid=60s;
        resolver_timeout           2s;

        location / {
            proxy_pass                    https://www.lovelive-anime.jp;
            proxy_set_header Host         www.lovelive-anime.jp;
            
            proxy_http_version            1.1;
            proxy_set_header Upgrade      $http_upgrade;
            proxy_set_header Connection   $connection_upgrade;

            # 确保 sub_filter 能替换内容（防止被上游 gzip 压缩导致替换失效）
            proxy_set_header Accept-Encoding "";

            proxy_set_header X-Real-IP            $remote_addr;
            proxy_set_header X-Forwarded-For      $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto    $scheme;
            proxy_ssl_server_name                 on;

            # 传输与超时调整
            proxy_connect_timeout                 10s;
            proxy_read_timeout                    300s;
            proxy_send_timeout                    300s;
            
            # 内容替换
            sub_filter                            'www.lovelive-anime.jp' '$host';
            sub_filter_once                       off;
            sub_filter_types                      text/html text/css text/xml application/javascript;
        }
    }
}
